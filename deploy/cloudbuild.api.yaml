steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/api.Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/rovo/api:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/rovo/api:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - rovo-api
      - --project=$PROJECT_ID
      - --region=us-central1
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/rovo/api:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
