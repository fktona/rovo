[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[fuzz]
runs = 512
